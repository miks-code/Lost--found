<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login | FindIt</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body class="auth-page">
<div class="hero-bg"></div>
<div class="hero-overlay"></div>
<header class="public-header">
<a class="brand" href="index.html">
  <img src="assets/logo.png" alt="FindIt">
  <span>FindIt</span></a>
<button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">☰</button>
<nav class="public-nav" id="publicNav">
  <a href="index.html">Home</a>
  <a href="index.html#about">About</a>
  <a class="nav-btn login-outline active" href="login.html">Login</a><a class="nav-btn signup-btn" href="signup.html">Sign Up</a></nav>
</header>
<main class="auth-center">
  <form class="auth-card" id="loginForm">
<img class="auth-logo" src="assets/logo.png" alt="FindIt">
<h1>Welcome back!</h1>
<p>Log in to report or search lost and found items.</p>
<label>Email</label>
<input id="loginEmail" type="email" placeholder="user@icct.edu.ph" required>
<label>Password</label>
<div class="password-box">
  <input id="loginPassword" type="password" placeholder="Enter your password" required>
  <button type="button" class="eye-btn" data-target="loginPassword">◉</button>
  </div>
<div class="auth-options">
  <label class="remember">
    <input type="checkbox" id="rememberMe"> Remember me</label>
    <a href="#" id="forgotLink">Forgot password?</a>
    </div>
<button class="dark-btn" type="submit">Login</button>
<p class="switch-auth">Don't have an account? <a href="signup.html">Sign up</a></p>
<p id="loginMessage" class="form-message"></p>
</form>
</main>
<script src="script.js"></script>
</body>
</html>
